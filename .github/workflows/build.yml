name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # The same signing key on every build is what lets a new APK install over the old one.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/stock-release.p12
          echo "Signing key restored ($(wc -c < app/stock-release.p12) bytes)"

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug

      - name: Show signing certificate (must be identical on every build)
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|Signer #1 certificate DN" || true

      - uses: actions/upload-artifact@v4
        with: { name: stock-app-debug, path: app/build/outputs/apk/debug/app-debug.apk }
